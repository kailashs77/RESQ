[project]
name = "resq"
version = "0.1.0"
description = "Predictive emergency routing and just-in-time green corridor research platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
forecast = [
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "torch>=2.9,<3",
]
sumo = [
  "eclipse-sumo==1.27.1",
  "rtree>=1.4,<2",
  "sumolib==1.27.1",
  "traci==1.27.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
